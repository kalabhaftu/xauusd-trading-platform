[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-trading-platform"
version = "0.1.0"
description = "Auditable XAU/USD research and guarded MT5 demo/live automation"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2,<3", "pandas>=2.2,<4", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "SQLAlchemy>=2.0,<3", "alembic>=1.14,<2",
  "backtesting==0.6.5", "streamlit>=1.45,<2", "plotly>=6,<7",
  "httpx>=0.28,<1", "pyarrow>=19,<25",
  "MetaTrader5==5.0.6231; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "pandas-stubs>=2.2"]
launcher = ["pyinstaller==6.22.3"]

[project.scripts]
xau-bot = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["demo: explicitly invoked read-only MT5 integration checks"]
addopts = "-m 'not demo'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["app"]
